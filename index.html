<script>
  document.addEventListener("DOMContentLoaded", () => {
    const hamburger = document.querySelector(".hamburger-overlay");
    const navOverlay = document.querySelector(".nav-overlay");

    hamburger.addEventListener("click", () => {
      hamburger.classList.toggle("active");
      navOverlay.classList.toggle("active");

      // ARIA属性の更新（アクセシビリティ対応）
      const expanded = hamburger.getAttribute("aria-expanded") === "true";
      hamburger.setAttribute("aria-expanded", !expanded);
      navOverlay.setAttribute("aria-hidden", expanded);
    });

    // メニューのリンクをクリックしたら閉じる
    document.querySelectorAll(".nav-overlay__link").forEach(link => {
      link.addEventListener("click", () => {
        hamburger.classList.remove("active");
        navOverlay.classList.remove("active");
        hamburger.setAttribute("aria-expanded", false);
        navOverlay.setAttribute("aria-hidden", true);
      });
    });
  });
</script>
<script>
// ページリンクのスクロールアニメーション
document.addEventListener("DOMContentLoaded", () => {
  const cards = document.querySelectorAll(".page-links .card");

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("visible");
        observer.unobserve(entry.target); // 一度表示されたら監視解除
      }
    });
  }, {
    threshold: 0.1
  });

  cards.forEach(card => {
    observer.observe(card);
  });
});
</script>

<script>
  // 更新したいページのリスト
  const updatedPages = [
    { page: "ホーム", url: "index.html" },
    { page: "初心者教室", url: "pages/beginner/index.html" },
    { page: "スケジュール", url: "pages/schedule/index.html" },
    { page: "大会・審査要項", url: "pages/tournament/index.html" },
    { page: "大会・審査実績", url: "pages/seiseki/index.html" },
    { page: "会員専用", url: "pages/member/index.html" },
    { page: "お問い合わせ", url: "pages/contact/index.html" }
  ];

  const newsList = document.getElementById("news-list");

  // URLから最終更新日を取得する関数
  async function getLastModified(url) {
    const response = await fetch(url, { method: "HEAD" });
    return response.headers.get("last-modified");
  }

  async function showUpdates() {
    const updates = [];

    for (const p of updatedPages) {
      const lastModified = await getLastModified(p.url);
      if (lastModified) {
        updates.push({
          page: p.page,
          url: p.url,
          date: new Date(lastModified)
        });
      }
    }

    // 更新日でソート（新しい順）
    updates.sort((a, b) => b.date - a.date);

    // 最新5件だけ表示
    updates.slice(0, 5).forEach(update => {
      const li = document.createElement("li");
      const a = document.createElement("a");

      const month = update.date.getMonth() + 1;
      const day = update.date.getDate();

      a.href = update.url;
      a.textContent = `${month}月${day}日 ${update.page}を更新しました`;

      li.appendChild(a);
      newsList.appendChild(li);
    });
  }

  showUpdates();
</script>

const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchResults = document.getElementById('searchResults');

searchBtn.addEventListener('click', () => {
  const query = searchInput.value.toLowerCase();
  searchResults.innerHTML = '';

  const results = siteData.filter(item => {
    const mainText = item.title + ' ' + item.description;
    const sectionText = item.sections ? item.sections.map(s => s.subtitle + ' ' + s.description).join(' ') : '';
    return mainText.toLowerCase().includes(query) || sectionText.toLowerCase().includes(query);
  });

  if (results.length === 0) {
    searchResults.innerHTML = '<p>該当する情報は見つかりませんでした。</p>';
    return;
  }

  results.forEach(item => {
    const div = document.createElement('div');
    div.classList.add('search-item');

    let content = `<h3>${item.title}</h3><p>${item.description}</p>`;

    // PDFファイル
    if (item.file) {
      if (Array.isArray(item.file)) {
        content += '<ul>' + item.file.map(f => `<li><a href="${f}" target="_blank">📄 PDF</a></li>`).join('') + '</ul>';
      } else {
        content += `<p><a href="${item.file}" target="_blank">📄 PDF</a></p>`;
      }
    }

    // フォーム
    if (item.form) {
      content += `<iframe src="${item.form}" width="100%" height="600" frameborder="0"></iframe>`;
    }

    // アクセス情報
    if (item.access) {
      content += '<div class="access-info">';
      for (const key in item.access) {
        content += `<p><strong>${key}:</strong> ${item.access[key]}</p>`;
      }
      content += '</div>';
    }

    // 地図
    if (item.map) {
      content += `<iframe src="${item.map}" width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy"></iframe>`;
    }

    // サブセクション
    if (item.sections) {
      item.sections.forEach(sec => {
        content += `<h4>${sec.subtitle}</h4><p>${sec.description}</p>`;
        if (sec.link) content += `<p><a href="${sec.link}" target="_blank">リンクはこちら</a></p>`;
        if (sec.image) content += `<img src="${sec.image}" alt="${sec.subtitle}" style="max-width:200px;">`;
      });
    }

    div.innerHTML = content;
    searchResults.appendChild(div);
  });
});
</script>
<script>
    // テキストを文字単位に分割する関数
    function splitText(element) {
      const text = element.textContent;
      element.innerHTML = '';
      text.split('').forEach(char => {
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = char === ' ' ? '\u00A0' : char; // スペース処理
        element.appendChild(span);
      });
    }

    // タイトルのアニメーション
    const title = document.querySelector('.animated-title');
    splitText(title);

    gsap.from('.animated-title .char', {
      duration: 0.8,
      y: 100,
      opacity: 0,
      rotationX: -90,
      stagger: 0.05,
      ease: "back.out(1.7)",
      transformOrigin: "50% 50% -50px"
    });

    // 段落のアニメーション
    const paragraph = document.querySelector('.animated-paragraph');
    splitText(paragraph);

    gsap.from('.animated-paragraph .char', {
      duration: 0.6,
      y: 50,
      opacity: 0,
      stagger: 0.02,
      ease: "power2.out",
      delay: 1
    });

    // カラフルなテキストエフェクト
    gsap.to('.animated-title .char', {
      duration: 2,
      color: () => {
        const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c'];
        return colors[Math.floor(Math.random() * colors.length)];
      },
      stagger: 0.1,
      repeat: -1,
      yoyo: true,
      delay: 2
    });
  </script>


</body>
