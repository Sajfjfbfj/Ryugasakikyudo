<script>
  document.addEventListener("DOMContentLoaded", () => {
    const hamburger = document.querySelector(".hamburger-overlay");
    const navOverlay = document.querySelector(".nav-overlay");

    hamburger.addEventListener("click", () => {
      hamburger.classList.toggle("active");
      navOverlay.classList.toggle("active");

      // ARIA属性の更新（アクセシビリティ対応）
      const expanded = hamburger.getAttribute("aria-expanded") === "true";
      hamburger.setAttribute("aria-expanded", !expanded);
      navOverlay.setAttribute("aria-hidden", expanded);
    });

    // メニューのリンクをクリックしたら閉じる
    document.querySelectorAll(".nav-overlay__link").forEach(link => {
      link.addEventListener("click", () => {
        hamburger.classList.remove("active");
        navOverlay.classList.remove("active");
        hamburger.setAttribute("aria-expanded", false);
        navOverlay.setAttribute("aria-hidden", true);
      });
    });
  });
</script>
<script>
// ページリンクのスクロールアニメーション
document.addEventListener("DOMContentLoaded", () => {
  const cards = document.querySelectorAll(".page-links .card");

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("visible");
        observer.unobserve(entry.target); // 一度表示されたら監視解除
      }
    });
  }, {
    threshold: 0.1
  });

  cards.forEach(card => {
    observer.observe(card);
  });
});
</script>
<!-- 更新情報の自動生成スクリプト -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const newsList = document.getElementById("news-list");

  fetch('news.json')
    .then(response => response.json())
    .then(newsData => {
      newsData.forEach(item => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = item.link;
        a.textContent = `${item.date} - ${item.title}`;
        li.appendChild(a);
        newsList.appendChild(li);
      });
    })
    .catch(err => console.error('ニュースデータの読み込みに失敗しました', err));
});
</script>

<script>
  // 更新したページの情報

  const newsList = document.getElementById("news-list");
  const today = new Date();
  const formattedDate = `${today.getMonth() + 1}月${today.getDate()}日`;

  // 最新5件だけに制限
  const latestUpdates = updatedPages.slice(-5); // 配列の最後の5件を取得

  latestUpdates.forEach(update => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = update.url;
    a.textContent = `${formattedDate} ${update.page}を更新しました`;
    li.appendChild(a);
    newsList.appendChild(li);
  });
