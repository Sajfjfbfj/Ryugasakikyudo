name: Deploy and Notify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Send OneSignal Notification
        run: |
          curl -X POST "https://onesignal.com/api/v1/notifications" \
          -H "Content-Type: application/json" \
          -H "Authorization: Basic ${{ secrets.ONESIGNAL_API_KEY }}" \
          -d '{
            "app_id": "${{ secrets.ONESIGNAL_APP_ID }}",
            "included_segments": ["All"],
            "headings": {"en": "龍翔会サイトが更新されました"},
            "contents": {"en": "ページが更新されました!最新情報をご覧ください。"},
            "url": "https://ryugasakikyudo.vercel.app/"
          }'