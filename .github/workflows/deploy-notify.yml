name: Deploy and Notify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-version: latest
          vercel-args: '--prod'

      - name: Send OneSignal Notification
        run: |
          curl -X POST "https://onesignal.com/api/v1/notifications" \
          -H "Content-Type: application/json; charset=utf-8" \
          -H "Authorization: Basic ${{ secrets.ONESIGNAL_API_KEY }}" \
          -d '{
            "app_id": "${{ secrets.ONESIGNAL_APP_ID }}",
            "included_segments": ["All"],
            "headings": {"en": "龍翔会 弓道", "ja": "龍翔会 弓道"},
            "contents": {"en": "サイトに新しい情報・予定が追加されました。タップして確認できます。", "ja": "サイトに新しい情報・予定が追加されました。タップして確認できます。"},
            "url": "https://ryugasakikyudo.vercel.app/",
            "chrome_web_icon": "https://ryugasakikyudo.vercel.app/assets/img/apple-icon-180x180.png"
          }'
